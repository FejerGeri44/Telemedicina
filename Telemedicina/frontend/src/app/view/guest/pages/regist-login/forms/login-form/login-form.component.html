<ion-card>
  <ion-card-header>
    <ion-card-title>Bejelentkezés</ion-card-title>
  </ion-card-header>

  <ion-card-content class="form">
    <form [formGroup]="loginForm" (ngSubmit)="login()">

      <ion-item
        lines="none"
        [class.ios-custom-style]="this.platform.isIos">
        <ion-input
          class="field"
          label="E-mail"
          labelPlacement="floating"
          fill="outline"
          shape="round"
          formControlName="email"
          type="email">
        </ion-input>
      </ion-item>

      <ion-item
        lines="none"
        [class.ios-custom-style]="this.platform.isIos">
        <ion-input
          class="field"
          label="Jelszó"
          labelPlacement="floating"
          fill="outline"
          shape="round"
          [type]="showPassword ? 'text' : 'password'"
          formControlName="password">

          <ion-button
            slot="end"
            fill="clear"
            size="small"
            type="button"
            (click)="togglePassword()">
            <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
          </ion-button>
        </ion-input>
      </ion-item>

      <div class="button-row">
        <ion-button class="btn-secondary" type="button" (click)="backToDash()">Vissza</ion-button>
        <ion-button class="btn-primary" type="submit" [disabled]="loading">Belépés</ion-button>
      </div>

    </form>
  </ion-card-content>
</ion-card>
