<ion-card>
  <ion-card-header>
    <ion-card-title>Páciens regisztráció</ion-card-title>
  </ion-card-header>

  <ion-card-content class="form">

    <!-- 1. sor -->
    <div class="grid-pair">
      <ion-item>
        <ion-label class="custom-label" position="stacked">Teljes név</ion-label>
        <ion-input
          class="custom-input"
          type="text"
          [(ngModel)]="fullName"
          placeholder="Teljes név"
          fill="outline"
          required
          clearInput/>
      </ion-item>
      <ion-item>
        <ion-label class="custom-label" position="stacked">E-mail cím</ion-label>
        <ion-input
          class="custom-input"
          type="email"
          [(ngModel)]="email"
          placeholder="Email cím"
          fill="outline"
          required
          clearInput/>
      </ion-item>
    </div>

    <!-- 2. sor -->
    <div class="grid-pair">
      <ion-item>
        <ion-label class="custom-label" position="stacked">Jelszó</ion-label>
        <ion-input
          class="custom-input"
          [type]="showPassword ? 'text' : 'password'"
          [(ngModel)]="password"
          placeholder="Jelszó"
          fill="outline"
          required
          clearInput>
        </ion-input>
        <ion-icon
          *ngIf="password"
          [name]="showPassword ? 'eye-off' : 'eye'"
          (click)="togglePasswordVisibility()"
          class="password-toggle-icon">
        </ion-icon>
      </ion-item>
      <ion-item>
        <ion-label class="custom-label" position="stacked">Jelszó</ion-label>
        <ion-input
          class="custom-input"
          [type]="showPassword ? 'text' : 'password'"
          [(ngModel)]="password_again"
          placeholder="Jelszó"
          fill="outline"
          required
          clearInput>
        </ion-input>
        <ion-icon
          *ngIf="password_again"
          [name]="showPassword ? 'eye-off' : 'eye'"
          (click)="togglePasswordVisibility()"
          class="password-toggle-icon">
        </ion-icon>
      </ion-item>
    </div>

    <!-- 3. sor -->
    <div class="grid-pair">
      <ion-item>
        <ion-label class="custom-label" position="stacked">Telefonszám</ion-label>
        <ion-input
          class="custom-input"
          type="tel"
          [(ngModel)]="phoneNumber"
          placeholder="06XXXXXXXXX"
          fill="outline"
          required
          clearInput/>
      </ion-item>
      <ion-item>
        <ion-label class="custom-label" position="stacked">TAJ szám</ion-label>
        <ion-input
          class="custom-input"
          type="text"
          [(ngModel)]="taj"
          placeholder="TAJ"
          fill="outline"
          required
          clearInput/>
      </ion-item>
    </div>

    <!-- 4. sor -->
    <div class="grid-pair">
      <ion-item>
        <ion-label class="custom-label" position="stacked">Cím</ion-label>
        <ion-input
          class="custom-input"
          type="text"
          [(ngModel)]="address"
          placeholder="Baranyai utca 52."
          fill="outline"
          required
          clearInput/>
      </ion-item>
      <ion-item>
        <ion-label class="custom-label" position="stacked">Születési dátum</ion-label>
        <ion-input
          class="custom-input"
          type="date"
          [(ngModel)]="birthDate"
          fill="outline"
          required
          clearInput/>
      </ion-item>
    </div>

    <div class="grid-single">
      <ion-item>
        <ion-label class="custom-label" position="stacked">Nem</ion-label>
        <ion-radio-group [(ngModel)]="gender" required>
          <ion-item lines="none">
            <ion-label>Férfi</ion-label>
            <ion-radio slot="start" value="férfi"></ion-radio>
          </ion-item>
          <ion-item lines="none">
            <ion-label>Nő</ion-label>
            <ion-radio slot="start" value="nő"></ion-radio>
          </ion-item>
        </ion-radio-group>
      </ion-item>
    </div>

    <div class="button-row">
      <ion-button class="btn-secondary back" (click)="backToDash()">Vissza</ion-button>
      <ion-button class="btn-primary submit" (click)="onPatientRegister()">Csatlakozz</ion-button>
    </div>

  </ion-card-content>

</ion-card>
