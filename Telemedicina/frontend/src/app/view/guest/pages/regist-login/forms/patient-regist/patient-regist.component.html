<ion-card [ngClass]="{ 'admin-extra': calledByAdmin }">
  <ion-card-header>
    <ion-card-title>{{ title }}</ion-card-title>
  </ion-card-header>

  <ion-card-content class="form">
    <form [formGroup]="patientForm" (ngSubmit)="onPatientRegister()">

      <div class="grid-pair">
        <ion-input
          class="field"
          label="Teljes név"
          labelPlacement="floating"
          fill="outline"
          shape="round"
          type="text"
          formControlName="fullName"
          required
          clearInput>
        </ion-input>

        <ion-input
          class="field"
          label="E-mail cím"
          labelPlacement="floating"
          fill="outline"
          shape="round"
          type="email"
          formControlName="email"
          required
          clearInput>
        </ion-input>
      </div>

      <div class="grid-pair">
        <ion-input
          class="field"
          label="Jelszó"
          labelPlacement="floating"
          fill="outline"
          shape="round"
          [type]="showPwd1 ? 'text' : 'password'"
          formControlName="password"
          required
          clearInput>
          <ion-button
            slot="end"
            fill="clear"
            size="small"
            type="button"
            (click)="togglePwd1()"
            aria-label="Jelszó mutatása/elrejtése">
            <ion-icon [name]="showPwd1 ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
          </ion-button>
        </ion-input>

        <ion-input
          class="field"
          label="Jelszó ismét"
          labelPlacement="floating"
          fill="outline"
          shape="round"
          [type]="showPwd1 ? 'text' : 'password'"
          formControlName="password_again"
          required
          clearInput>
          <ion-button
            slot="end"
            fill="clear"
            size="small"
            type="button"
            (click)="togglePwd2()"
            aria-label="Jelszó mutatása/elrejtése">
            <ion-icon [name]="showPwd2 ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
          </ion-button>
        </ion-input>
      </div>

      <div class="grid-pair">
        <ion-input
          class="field"
          label="Telefonszám"
          labelPlacement="floating"
          fill="outline"
          shape="round"
          type="tel"
          formControlName="phoneNumber"
          required
          clearInput>
        </ion-input>

        <ion-input
          class="field"
          label="TAJ szám"
          labelPlacement="floating"
          fill="outline"
          shape="round"
          type="text"
          formControlName="taj"
          required
          clearInput>
        </ion-input>
      </div>

      <div class="grid-pair">
        <ion-input
          class="field"
          label="Cím"
          labelPlacement="floating"
          fill="outline"
          shape="round"
          type="text"
          formControlName="address"
          required
          clearInput>
        </ion-input>

        <ion-input
          class="field"
          label="Születési dátum"
          labelPlacement="floating"
          fill="outline"
          shape="round"
          type="date"
          formControlName="birthDate"
          required>
        </ion-input>
      </div>

      <div class="grid-single">
        <ion-item lines="none" class="radio-field">
          <ion-label>Páciens neme</ion-label>
          <ion-radio-group formControlName="gender" required>
            <ion-item lines="none">
              <ion-label>Férfi</ion-label>
              <ion-radio slot="start" value="Férfi"></ion-radio>
            </ion-item>
            <ion-item lines="none">
              <ion-label>Nő</ion-label>
              <ion-radio slot="start" value="Nő"></ion-radio>
            </ion-item>
          </ion-radio-group>
        </ion-item>
      </div>

      <div class="button-row">
        <ion-button *ngIf="!calledByAdmin" class="btn-secondary back" type="button" (click)="backToDash()">Vissza</ion-button>
        <ion-button [ngClass]="{ 'full-width': calledByAdmin }" class="btn-primary submit" type="submit" [disabled]="loading">Páciens regisztráció</ion-button>
      </div>

    </form>
  </ion-card-content>
</ion-card>
