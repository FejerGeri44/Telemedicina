<app-guest-navbar></app-guest-navbar>

<ion-content>
  <div class="full-height-container">
    <div class="error-card">
      <div class="icon-wrapper">
        <ion-icon name="shield-half-outline" class="error-icon"></ion-icon>
      </div>

      <h1 class="error-title">Hozzáférés megtagadva</h1>

      <p class="error-subtitle">
        Úgy tűnik, nincs jogosultsága az oldal megtekintéséhez, vagy a munkamenet lejárt.
        <br>
        <span *ngIf="!isAuthenticated">Kérjük, <strong>jelentkezzen be</strong> a folytatáshoz.</span>
      </p>

      <div class="action-buttons">
        <ion-button
          (click)="goToHome()"
          expand="block"
          fill="clear"
          size="default"
          color="medium">
          <ion-icon name="home-outline" slot="start"></ion-icon>
          Vissza a kezdőlapra
        </ion-button>

        <ion-button
          (click)="goBack()"
          expand="block"
          fill="clear"
          size="default"
          color="medium">
          <ion-icon name="arrow-undo-outline" slot="start"></ion-icon>
          Előző oldal
        </ion-button>
      </div>

      <div class="support-text">
        Probléma esetén vegye fel a kapcsolatot az <a href="#">ügyfélszolgálattal</a>.
      </div>
    </div>
  </div>
</ion-content>

<app-guest-footer></app-guest-footer>
