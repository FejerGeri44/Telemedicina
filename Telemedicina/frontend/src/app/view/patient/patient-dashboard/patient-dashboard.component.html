<app-patient-navbar></app-patient-navbar>

<div class="page">

  <ion-content class="grid">
    <ion-card class="profile-card">
      <div class="data-left">
        <ion-card-header class="header-content">
          <ion-avatar class="profile-picture">
            <img *ngIf="user" [src]="user.pictureUrl" alt="Profilkép" />
          </ion-avatar>
          <ion-card-title *ngIf="user"><h2>{{ user.name }}</h2></ion-card-title>
        </ion-card-header>

        <ion-card-content>
          <div class="user-grid">
            <div class="user-info">
              <div class="title">Kor</div>
              <div class="value">{{ getAge(user?.birthDate) }}</div>
            </div>
            <div class="user-info">
              <div class="title">Magasság</div>
              <div class="value">{{ user?.height }}</div>
            </div>
            <div class="user-info">
              <div class="title">Cím</div>
              <div class="value">{{ user?.address }}</div>
            </div>
            <div class="user-info">
              <div class="title">Súly</div>
              <div class="value">{{ user?.weight }}</div>
            </div>
          </div>
        </ion-card-content>

        <div class="edit-button-container">
          <button class="edit-button" (click)="openEditModal()">Módosítás</button>
        </div>
      </div>

      <ion-content class="modal" *ngIf="isEditModalOpen">
        <div class="modal-content">
          <h2>Adatok módosítása</h2>
          <form>
            <div *ngIf="previewImage">
              <img [src]="previewImage" alt="Profilkép előnézet">
            </div>

            <button class="select-picture-button" type="button" (click)="triggerFileInput()">Kép kiválasztása</button>
            <input type="file" #fileInput (change)="onFileSelected($event)" accept="image/*" style="display: none;" />

            <div class="modal-items">
              <div class="form-group">
                <label position="stacked">Magasság</label>
                <input type="number" [(ngModel)]="editUser.height" name="height">
              </div>

              <div class="form-group">
                <label position="stacked">Súly</label>
                <input type="number" [(ngModel)]="editUser.weight" name="weight">
              </div>

              <div class="form-group">
                <label position="stacked">Cím</label>
                <input type="text" [(ngModel)]="editUser.address" name="address">
              </div>

              <div class="form-group">
                <label position="stacked">Mobil szám</label>
                <input type="text" [(ngModel)]="editUser.phoneNumber" name="phoneNumber">
              </div>

              <div class="form-group">
                <label position="stacked">Otthoni szám</label>
                <input type="text" [(ngModel)]="editUser.homePhone" name="homePhone">
              </div>
              </div>

            <div class="button-row">
              <ion-button class="cancel" type="button" (click)="closeEditModal()">Mégse</ion-button>
              <ion-button class="submit" type="submit" (click)="saveChanges()">Mentés</ion-button>
            </div>

          </form>
        </div>
      </ion-content>

      <ion-card-content class="data-right">
        <ion-list class="user-data">
          <div class="user-info">
            <div class="title">Email</div>
            <div class="value">{{ user?.email }}</div>
          </div>
          <div class="user-info">
            <div class="title">Születési dátum</div>
            <div class="value">{{ user?.birthDate }}</div>
          </div>
          <div class="user-info">
            <div class="title">Mobil</div>
            <div class="value">{{ user?.phoneNumber }}</div>
          </div>
          <div class="user-info">
            <div class="title">Otthoni</div>
            <div class="value">{{ user?.homePhone }}</div>
          </div>
        </ion-list>
      </ion-card-content>
    </ion-card>
    <ion-card class="appointments"></ion-card>
    <ion-card class="results"></ion-card>
    <ion-card class="prescriptions"></ion-card>
  </ion-content>

</div>
