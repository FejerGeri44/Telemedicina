<app-patient-navbar></app-patient-navbar>

<ion-content class="page-container">
  <div class="doctor-container">
    <div class="header">
      <div class="upper-section">
        <ion-searchbar
          placeholder="Keresés orvosra..."
          [(ngModel)]="searchTerm"
          (keydown.enter)="onSearchChange()">
        </ion-searchbar>

        <!-- Filter -->
        <div class="filter-container">
          <ion-icon name="options" (click)="toggleFilters()"></ion-icon>

          <ion-list *ngIf="showFilters" class="filter-panel">
            <ion-item *ngFor="let specialty of specialties" lines="none" (click)="toggleSpecialty(specialty)" button>
              <ion-checkbox
                slot="start"
                [checked]="selectedSpecialties.includes(specialty)">
              </ion-checkbox>
              <ion-label>{{ specialty }}</ion-label>
            </ion-item>
          </ion-list>
        </div>
      </div>

      <ion-button class="btn-primary search" (click)="onSearchChange()">Keresés</ion-button>
    </div>

    <div class="pagination">
      <ion-icon name="chevron-back-outline" (click)="prevPageSet()" [class.disabled]="currentPage === 1"></ion-icon>

      <span
        *ngFor="let page of visiblePages"
        (click)="goToPage(page)"
        [class.active]="page === currentPage">
        {{ page }}
      </span>

      <ion-icon name="chevron-forward-outline" (click)="nextPageSet()" [class.disabled]="currentPage === totalPages"></ion-icon>
    </div>

    <!-- SKELETON ÁLLAPOT -->
    <ion-grid *ngIf="isLoading">
      <ion-row>
        <ion-col class="custom-col" *ngFor="let s of [1, 2, 3, 4, 5, 6]">
          <ion-card>
            <ion-card-header class="doctor-card-header">
              <div class="doctor-avatar">
                <ion-skeleton-text animated class="skeleton-avatar"></ion-skeleton-text>
              </div>
              <div class="doctor-header-info">
                <ion-card-title>
                  <ion-skeleton-text animated class="skeleton-title"></ion-skeleton-text>
                </ion-card-title>
                <ion-card-subtitle>
                  <ion-skeleton-text animated class="skeleton-subtitle"></ion-skeleton-text>
                </ion-card-subtitle>
              </div>
            </ion-card-header>

            <ion-card-content>
              <ion-skeleton-text animated class="skeleton-line"></ion-skeleton-text>
              <ion-skeleton-text animated class="skeleton-line"></ion-skeleton-text>
              <ion-skeleton-text animated class="skeleton-line"></ion-skeleton-text>
              <ion-skeleton-text animated class="skeleton-line short"></ion-skeleton-text>
            </ion-card-content>

            <div class="button-row">
              <ion-skeleton-text animated class="skeleton-button"></ion-skeleton-text>
              <ion-skeleton-text animated class="skeleton-button"></ion-skeleton-text>
            </div>
          </ion-card>
        </ion-col>
      </ion-row>
    </ion-grid>

    <!-- VALÓDI TARTALOM -->
    <ion-grid *ngIf="!isLoading">
      <ion-row>
        <ion-col class="custom-col" *ngFor="let doctor of paginatedDoctors">
          <ion-card>
            <ion-card-header class="doctor-card-header">
              <ion-avatar>
                <img [src]="doctor.User.pictureUrl" class="doctor-avatar" alt="Profilkép" draggable="false"/>
              </ion-avatar>
              <div class="doctor-header-info">
                <ion-card-title>Dr. {{ doctor.User.name }}</ion-card-title>
                <ion-card-subtitle>{{ doctor.speciality }}</ion-card-subtitle>
              </div>
            </ion-card-header>

            <ion-card-content>
              <p><strong>Email:</strong> {{ doctor.User.email }}</p>
              <p><strong>Telefon:</strong> {{ doctor.User.phoneNumber }}</p>
              <p><strong>Cím:</strong> {{ doctor.User.address }}</p>
              <p><strong>Bemutatkozás:</strong> {{ doctor.introduction }}</p>
            </ion-card-content>

            <div class="button-row">
              <ion-button class="btn-primary" (click)="openAppointmentModal(doctor)">Időpontfoglalás</ion-button>
              <ion-button class="btn-secondary">Csevegés</ion-button>
            </div>
          </ion-card>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>
</ion-content>
