<div class="message-table-scroll">
  <ion-grid class="message-table">
    <ion-row class="table-header">
      <ion-col size="2"><span class="th">Orvos</span></ion-col>
      <ion-col size="2"><span class="th">Specialitás</span></ion-col>
      <ion-col size="2" class="sort">
        <span class="th">Időpont</span>
        <ion-icon name="swap-vertical-outline"></ion-icon>
      </ion-col>
      <ion-col size="2"><span class="th">Cím</span></ion-col>
      <ion-col size="2"><span class="th">Telefonszám</span></ion-col>
      <ion-col size="2" class="text-center"><span class="th">Email</span></ion-col>
    </ion-row>

    <ion-row *ngFor="let row of dummyRows" class="table-row">
      <ion-col size="2">
        <div class="doctor-info">
          <div class="avatar">
            <ion-skeleton-text animated style="width: 40px; height: 40px; border-radius: 50%;"></ion-skeleton-text>
          </div>
          <div class="stack">
            <ion-skeleton-text animated style="border-radius: 10px; width: 120px; height: 10px;"></ion-skeleton-text>
          </div>
        </div>
      </ion-col>

      <ion-col size="2" class="chips-col">
        <ion-skeleton-text animated style="border-radius: 10px; width: 70%; height: 10px;"></ion-skeleton-text>
      </ion-col>

      <ion-col size="2" class="hide-sm">
        <ion-skeleton-text animated style="border-radius: 10px; width: 90%; height: 10px;"></ion-skeleton-text>
      </ion-col>

      <ion-col size="2" class="message-column">
        <ion-skeleton-text animated style="border-radius: 10px; width: 85%; height: 10px;"></ion-skeleton-text>
      </ion-col>

      <ion-col size="2">
        <ion-skeleton-text animated style="border-radius: 10px; width: 60%; height: 10px;"></ion-skeleton-text>
      </ion-col>

      <ion-col size="2">
        <ion-skeleton-text animated style="border-radius: 10px; width: 80%; height: 10px;"></ion-skeleton-text>
      </ion-col>
    </ion-row>
  </ion-grid>
</div>
