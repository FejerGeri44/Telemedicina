<div class="filter-bar">
  <div class="filter-bar__left">
    <input
      type="text"
      class="search-input"
      [value]="query"
      placeholder="Keresés az adatok között..."
      aria-label="Szabad szöveges kereső"
    />
  </div>

  <div class="filter-bar__right">
    <button
      type="button"
      class="badge"
      [class.badge--active]="activeTab === 'appointments'"
      (click)="setTab('appointments')"
    >
      Időpontjaim
    </button>

    <button
      type="button"
      class="badge"
      [class.badge--active]="activeTab === 'documents'"
      (click)="setTab('documents')"
    >
      Dokumentumaim
    </button>

    <button
      type="button"
      class="badge"
      [class.badge--active]="activeTab === 'diagnoses'"
      (click)="setTab('diagnoses')"
    >
      Diagnózisaim
    </button>
  </div>
</div>

<app-appointment-table
  *ngIf="activeTab === 'appointments' && myAppointmentCalledAndLoaded"
  [myAppointments]="myAppointments">
</app-appointment-table>

<app-appointment-table-skeleton
  *ngIf="activeTab === 'appointments' && !myAppointmentCalledAndLoaded">
</app-appointment-table-skeleton>

<app-diagnoses-table
  *ngIf="activeTab === 'diagnoses' && myDiagnosesCalledAndLoaded"
  [myDiagnoses]="myDiagnoses">
</app-diagnoses-table>

<app-diagnoses-table-skeleton
  *ngIf="activeTab === 'diagnoses' && !myDiagnosesCalledAndLoaded">
</app-diagnoses-table-skeleton>
