<ion-header>
  <ion-toolbar>
    <ion-title>Időpontfoglalás</ion-title>
    <ion-buttons slot="end">
      <ion-button class="close-button" fill="clear" (click)="dismiss()">
        <ion-icon name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<div class="modal-body">

  <div class="doctor-header">
    <h2>Dr. {{ doctorData.user.name }}</h2>
  </div>

  <div class="time-table">
    <div class="table-month-header">
      <ion-button fill="clear" size="small" (click)="changeMonth(-1)">
        <ion-icon slot="icon-only" name="chevron-back-outline"></ion-icon>
      </ion-button>

      <div class="month-label">
        {{ selectedDate | date: 'yyyy. MMMM' }}
      </div>

      <ion-button fill="clear" size="small" (click)="changeMonth(1)">
        <ion-icon slot="icon-only" name="chevron-forward-outline"></ion-icon>
      </ion-button>
    </div>

    <div class="time-table-header">
      <ion-button fill="clear" size="small" (click)="changeWeek(-1)">
        <ion-icon slot="icon-only" name="chevron-back-outline"></ion-icon>
      </ion-button>

      <div class="day-header" *ngFor="let day of days">
        <div>{{ day.weekday }}</div>
        <div>{{ day.date | date: 'MMM d.' }}</div>
      </div>

      <ion-button fill="clear" size="small" (click)="changeWeek(1)">
        <ion-icon slot="icon-only" name="chevron-forward-outline"></ion-icon>
      </ion-button>
    </div>

    <div class="time-table-body">
      <div class="time-column" *ngFor="let day of days">
        <ion-button
          size="small"
          [ngClass]="getButtonClass(day, time)"
          *ngFor="let time of timeSlots"
          (click)="selectTime(day, time)">
          {{ time }}
        </ion-button>
      </div>
    </div>
  </div>
</div>
