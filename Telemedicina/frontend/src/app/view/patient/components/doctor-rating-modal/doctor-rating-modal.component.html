<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="end">
      <ion-button (click)="dismiss()" color="medium">
        <ion-icon slot="icon-only" name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<div class="inner-content">
  <div class="modal-wrapper">

    <div class="doctor-profile" *ngIf="rating?.doctor">
      <div class="avatar-container">
        <ion-avatar>
          <img
            [ngSrc]="rating.doctor.user.pictureUrl"
            alt="Orvos profilkép"
            width="100"
            height="100"
          />
        </ion-avatar>
      </div>

      <h2>Dr. {{ rating.doctor.user.name }}</h2>
      <p class="speciality">{{ rating.doctor.doctor.speciality }}</p>
    </div>

    <div class="rating-section">
      <div class="stars-container" (mouseleave)="onMouseLeave()">
        <ion-icon
          *ngFor="let star of stars"
          [name]="getStarIcon(star)"
          [class.active]="isStarActive(star)"
          (mousemove)="onMouseMove(star, $event)"
          (click)="rate(star, $event)"
        ></ion-icon>
      </div>

      <div class="rating-label">
        <ng-container *ngIf="hoverRating > 0 || ratingNumber > 0">
          <span>{{ hoverRating > 0 ? hoverRating : ratingNumber }}</span> / 5.0
        </ng-container>
        <ng-container *ngIf="hoverRating === 0 && ratingNumber === 0">
          Érintse meg az értékeléshez
        </ng-container>
      </div>
    </div>

  </div>
</div>

<ion-footer>
  <ion-toolbar>
    <div class="action-buttons">
      <ion-button class="btn-secondary" (click)="dismiss()">
        Vissza
      </ion-button>

      <ion-button
        class="btn-primary"
        (click)="confirmSubmit()"
        [disabled]="ratingNumber === 0 || isLoading">
        Mentés
      </ion-button>
    </div>
  </ion-toolbar>
</ion-footer>
