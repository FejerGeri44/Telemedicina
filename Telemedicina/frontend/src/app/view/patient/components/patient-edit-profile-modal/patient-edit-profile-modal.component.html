<ion-header>
  <ion-toolbar>
    <ion-title>Profil módosítása</ion-title>
    <ion-buttons slot="end">
      <ion-button fill="clear" (click)="close()">
        <ion-icon name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="epm-content">
  <section class="epm-header">
    <div class="pc-avatar">
      <img
        ngSrc="{{ tempPreviewUrl || user.user.pictureUrl }}"
        alt="Profilkép"
        draggable="false"
        fill
        priority
      />
      <label class="avatar-edit">
        <ion-icon name="camera"></ion-icon>
        <input
          type="file"
          hidden
          (change)="onFileSelected($event)"
          accept="image/*" />
      </label>
    </div>
    <div class="epm-headline">
      <h2>{{ user.user.name }}</h2>
      <p class="muted">{{ user.user.email }}</p>
    </div>
  </section>

  <form [formGroup]="editProfileForm" (ngSubmit)="save()">
    <section class="epm-grid">
      <div class="col">
        <ion-item [lines]="this.platform.isIos  ? 'full' : 'none'">
          <ion-label class="custom-label" position="stacked">Név</ion-label>
          <ion-input
            class="custom-input"
            type="text"
            formControlName="name"  [placeholder]="user.user.name"
            fill="outline"
            clearInput>
          </ion-input>
        </ion-item>

        <ion-item [lines]="this.platform.isIos  ? 'full' : 'none'">
          <ion-label class="custom-label" position="stacked">Cím</ion-label>
          <ion-input
            class="custom-input"
            type="text"
            formControlName="address" [placeholder]="user.user.address"
            fill="outline"
            clearInput>
          </ion-input>
        </ion-item>
      </div>

      <div class="col">
        <ion-item [lines]="this.platform.isIos  ? 'full' : 'none'">
          <ion-label class="custom-label" position="stacked">Mobil</ion-label>
          <ion-input
            class="custom-input"
            type="tel"
            formControlName="phoneNumber" [placeholder]="user.user.phoneNumber"
            fill="outline"
            clearInput>
          </ion-input>
        </ion-item>

        <ion-item [lines]="this.platform.isIos  ? 'full' : 'none'">
          <ion-label class="custom-label" position="stacked">Otthoni telefon</ion-label>
          <ion-input
            class="custom-input"
            type="tel"
            formControlName="homePhone" [placeholder]="user.patient.homePhone"
            fill="outline"
            clearInput>
          </ion-input>
        </ion-item>
      </div>

      <div class="row">
        <ion-item [lines]="this.platform.isIos ? 'full' : 'none'">
          <ion-label class="custom-label" position="stacked">Magasság (cm)</ion-label>
          <ion-input
            class="custom-input"
            type="number"
            inputmode="numeric"
            formControlName="height"
            [placeholder]="user.patient.height"
            fill="outline"
            clearInput>
          </ion-input>
        </ion-item>

        <ion-item [lines]="this.platform.isIos  ? 'full' : 'none'">
          <ion-label class="custom-label" position="stacked">Testsúly (kg)</ion-label>
          <ion-input
            class="custom-input"
            type="number"
            inputmode="numeric"
            formControlName="weight" [placeholder]="user.patient.weight"
            fill="outline"
            clearInput>
          </ion-input>
        </ion-item>
      </div>
    </section>

    <section class="epm-tags-section">
      <h3>Különleges adatok</h3>

      <div class="tag-editor">
        <div class="tag-inputs-group">
          <ion-item class="tag-item">
            <ion-label position="stacked">Adattípus</ion-label>
            <ion-select
              interface="popover"
              placeholder="Válassz típust"
              [(ngModel)]="newTagKey"
              name="newTagKey"
              [ngModelOptions]="{standalone: true}" (ionChange)="onTagTypeChange()">
              <ion-select-option *ngFor="let opt of tagOptions" [value]="opt.key"> {{ opt.label }}</ion-select-option>
            </ion-select>
          </ion-item>

          <ion-item class="tag-item" *ngIf="newTagKey">
            <ion-label position="stacked">Érték</ion-label>
            <ion-select *ngIf="currentTagDef?.type === 'select'"
                        interface="popover"
                        placeholder="Válassz vércsoportot"
                        [(ngModel)]="newTag.tag_value"
                        name="tagValueSelect"
                        [ngModelOptions]="{standalone: true}"> <ion-select-option *ngFor="let v of currentTagDef?.options" [value]="v">{{ v }}</ion-select-option>
            </ion-select>
            <ion-input *ngIf="currentTagDef?.type === 'text'"
                       type="text"
                       [placeholder]="currentTagDef?.placeholder"
                       [(ngModel)]="newTag.tag_value"
                       name="tagValueInput"
                       [ngModelOptions]="{standalone: true}" clearInput></ion-input>
          </ion-item>
        </div>

        <div class="tag-actions">
          <ion-button size="small" fill="outline" (click)="resetNewTag()">Mégse</ion-button>
          <ion-button size="small" (click)="addTag()" [disabled]="!canAddTag()">Hozzáadás</ion-button>
        </div>
      </div>

      <div class="tags-preview" formArrayName="tags" *ngIf="tagsFormArray.length">
        <ion-chip *ngFor="let tagGroup of tagsFormArray.controls; let i = index" [formGroupName]="i">
          <ion-label>
            <strong>{{ tagGroup.value.tag_name }}:</strong> {{ tagGroup.value.tag_value }}
          </ion-label>
          <ion-icon name="close-circle" (click)="removeTag(i)"></ion-icon> </ion-chip>
      </div>
    </section>

    <div class="epm-actions">
      <ion-button
        class="btn-accent"
        type="submit"
        [disabled]="savingData || editProfileForm.invalid || (!editProfileForm.dirty && !file)">
        Mentés
      </ion-button>
    </div>
  </form>
</ion-content>
