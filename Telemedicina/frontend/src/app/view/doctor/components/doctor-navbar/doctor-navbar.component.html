<ion-header class="navbar" [class.mobile-open]="mobileMenuOpen">
  <ng-container *ngIf="userService.doctor$() | async as user; else navbarSkeleton">
    <ion-toolbar class="navbar-top" style="--z-index: 10002;">
      <div class="logo-title" slot="start">
        <img src="pictures/logo.png" alt="CareLink" />
        <ion-title class="site-title">CareLink</ion-title>
      </div>

      <ion-buttons slot="end" class="top-right-actions">
        <ion-button class="icon-btn notification" (click)="onNotifications()" aria-label="Értesítések">
          <ion-icon name="notifications-outline"></ion-icon>
          <span *ngIf="unreadCount$ | async as count; else noBadge"
                class="notif-badge"
                aria-live="polite"
                aria-label="Olvasatlan üzenetek száma">
              {{ count > 0 ? (count > 99 ? '99+' : count) : '' }}
          </span>
        </ion-button>
        <ng-template #noBadge></ng-template>

        <div class="profile-block desktop-only" (click)="toggleProfileMenu($event)">
          <ng-container *ngTemplateOutlet="userProfileInfo; context: { $implicit: user }"></ng-container>
          <ion-icon class="chevron" name="chevron-down-outline" [class.open]="profileOpen"></ion-icon>
        </div>

        <ion-button class="mobile-menu-btn" (click)="toggleMobileMenu()" aria-label="Menü" fill="clear">
          <ion-icon name="menu-outline"></ion-icon>
        </ion-button>
      </ion-buttons>
    </ion-toolbar>

    <ion-toolbar class="navbar-bottom desktop-only">
      <ng-container *ngTemplateOutlet="mainMenuNav"></ng-container>
    </ion-toolbar>

    <div class="backdrop" *ngIf="mobileMenuOpen" (click)="closeMobileMenu()" aria-hidden="true"></div>
    <aside id="mobile-drawer" class="drawer" [class.open]="mobileMenuOpen">
      <div class="drawer-header">
        <div class="user-inline">
          <ng-container *ngTemplateOutlet="userProfileInfo; context: { $implicit: user, inDrawer: true }"></ng-container>
        </div>
        <ion-button fill="clear" (click)="closeMobileMenu()" aria-label="Bezárás">
          <ion-icon name="close-outline"></ion-icon>
        </ion-button>
      </div>

      <nav class="drawer-nav">
        <ng-container *ngTemplateOutlet="mainMenuNav; context: { inDrawer: true }"></ng-container>
      </nav>

      <div class="drawer-footer">
        <ng-container *ngTemplateOutlet="profileActions; context: { isDrawer: true }"></ng-container>
      </div>
    </aside>
  </ng-container>

  <ng-template #userProfileInfo let-user let-inDrawer="inDrawer">
    <ion-avatar class="avatar">
      <img
        [ngSrc]="user.user.pictureUrl"
        alt="Profilkép"
        draggable="false"
        width="32"
        height="32"/> </ion-avatar>
    <div class="profile-info">
      <span class="name">{{ user.user.name }}</span>
      <span class="role">{{ user.user.role }}</span>
    </div>
  </ng-template>

  <ng-template #mainMenuNav let-inDrawer="inDrawer">
    <ul>
      <li *ngFor="let item of menuItems"
          (click)="inDrawer && closeMobileMenu()"
          [routerLink]="item.route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"> <ion-icon [name]="item.icon + '-outline'"></ion-icon>
        <span>{{ item.label }}</span>
      </li>
    </ul>
  </ng-template>

  <ng-template #profileActions let-isDrawer="isDrawer">
    <ion-button [class.drawer-action]="isDrawer" routerLink="/patient/patient-home" fill="clear" expand="block">
      <ion-icon name="person-circle-outline" slot="start"></ion-icon>
      <span>Profil</span>
    </ion-button>
    <ion-button [class.drawer-action]="isDrawer" class="delete-account-btn" (click)="confirmAccountDelete()" fill="clear" expand="block">
      <ion-icon name="trash-outline" slot="start"></ion-icon>
      <span>Fiók törlése</span>
    </ion-button>
    <ion-button [class.drawer-action]="isDrawer" (click)="confirmLogout()" fill="clear" expand="block">
      <ion-icon name="log-out-outline" slot="start"></ion-icon>
      <span>Kijelentkezés</span>
    </ion-button>
  </ng-template>

  <ng-template #navbarSkeleton>
    <ion-toolbar class="navbar-top">
      <div class="logo-title" slot="start">
        <ion-skeleton-text animated style="width:28px;height:28px;border-radius:6px;"></ion-skeleton-text>
        <ion-skeleton-text animated style="width:100px;height:20px;border-radius:6px;"></ion-skeleton-text>
      </div>

      <ion-buttons slot="end" class="top-right-actions">
        <ion-skeleton-text animated style="width:32px;height:32px;border-radius:8px;"></ion-skeleton-text>

        <div class="profile-block desktop-only">
          <div class="epm-avatar">
            <ion-skeleton-text animated style="width:32px;height:32px;border-radius:50%;"></ion-skeleton-text>
          </div>
          <div class="profile-info">
            <ion-skeleton-text animated style="width:120px;height:12px;border-radius:6px;margin-bottom:6px;"></ion-skeleton-text>
            <ion-skeleton-text animated style="width:60px;height:10px;border-radius:6px;"></ion-skeleton-text>
          </div>
          <ion-skeleton-text animated style="width:16px;height:16px;border-radius:4px;"></ion-skeleton-text>
        </div>

        <ion-skeleton-text class="mobile-menu-btn" animated style="width:32px;height:32px;border-radius:8px;"></ion-skeleton-text>
      </ion-buttons>
    </ion-toolbar>

    <ion-toolbar class="navbar-bottom desktop-only">
      <ul>
        <li *ngFor="let _ of [1,2,3,4,5]">
          <ion-skeleton-text animated style="width:18px;height:18px;border-radius:4px;margin-right:8px;"></ion-skeleton-text>
          <ion-skeleton-text animated style="width:80px;height:14px;border-radius:6px;"></ion-skeleton-text>
        </li>
      </ul>
    </ion-toolbar>
  </ng-template>
</ion-header>

<div class="profile-menu-container" *ngIf="profileOpen">
  <div class="profile-menu">
    <ng-container *ngTemplateOutlet="profileActions"></ng-container>
  </div>
</div>
