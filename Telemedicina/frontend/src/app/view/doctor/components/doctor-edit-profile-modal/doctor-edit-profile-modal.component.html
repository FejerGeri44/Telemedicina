<ion-header>
  <ion-toolbar>
    <ion-title>Profil módosítása</ion-title>
    <ion-buttons slot="end">
      <ion-button fill="clear" (click)="close()">
        <ion-icon name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="epm-content">
  <section class="epm-header">
    <div class="pc-avatar">
      <img
        ngSrc="{{ tempPreviewUrl || user.user.pictureUrl }}"
        alt="Profilkép"
        draggable="false"
        fill
        priority
      />
      <label class="avatar-edit">
        <ion-icon name="camera"></ion-icon>
        <input
          type="file"
          hidden
          (change)="onFileSelected($event)"
          accept="image/*" />
      </label>
    </div>
    <div class="epm-headline">
      <h2>Dr. {{ user.user.name }}</h2>
      <p class="muted">{{ user.user.email }}</p>
    </div>
  </section>

  <form [formGroup]="editProfileForm" (ngSubmit)="save()">
    <section class="epm-grid">
      <div class="col">
        <ion-item [lines]="this.platform.isIos ? 'full' : 'none'">
          <ion-label class="custom-label" position="stacked">Név</ion-label>
          <ion-input
            class="custom-input"
            type="text"
            formControlName="name" [placeholder]="user.user.name"
            fill="outline"
            clearInput>
          </ion-input>
        </ion-item>

        <ion-item [lines]="this.platform.isIos ? 'full' : 'none'">
          <ion-label class="custom-label" position="stacked">Cím</ion-label>
          <ion-input
            class="custom-input"
            type="text"
            formControlName="address" [placeholder]="user.user.address"
            fill="outline"
            clearInput>
          </ion-input>
        </ion-item>
      </div>

      <div class="col">
        <ion-item [lines]="this.platform.isIos ? 'full' : 'none'">
          <ion-label class="custom-label" position="stacked">Mobil</ion-label>
          <ion-input
            class="custom-input"
            type="tel"
            formControlName="phoneNumber" [placeholder]="user.user.phoneNumber"
            fill="outline"
            clearInput>
          </ion-input>
        </ion-item>

        <ion-item [lines]="this.platform.isIos ? 'full' : 'none'">
          <ion-label class="custom-label" position="stacked">Specializáció</ion-label>
          <ion-input
            class="custom-input"
            type="text"
            formControlName="speciality" [placeholder]="user.doctor.speciality"
            fill="outline"
            clearInput>
          </ion-input>
        </ion-item>
      </div>
    </section>

    <ion-item class="bio" [lines]="this.platform.isIos ? 'full' : 'none'">
      <ion-label class="custom-label" position="stacked">Bemutatkozás</ion-label>
      <ion-textarea
        class="custom-textarea"
        autoGrow="true"
        [rows]="6"
        formControlName="introduction"
        [placeholder]="user.doctor.introduction || 'Részletes bemutatkozás...'"
        fill="outline">
      </ion-textarea>
    </ion-item>

    <div class="epm-actions">
      <ion-button
        class="btn-accent"
        type="submit"
        [disabled]="savingData || editProfileForm.invalid || (!editProfileForm.dirty && !file)">
        Mentés
      </ion-button>
    </div>
  </form>
</ion-content>
