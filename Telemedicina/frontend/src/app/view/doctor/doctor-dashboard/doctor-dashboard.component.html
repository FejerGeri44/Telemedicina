<app-doctor-navbar></app-doctor-navbar>

<ion-content class="page-container">
  <div class="grid">
    <ion-card class="profile-card">
      <ion-grid>
        <ion-row>
          <ion-col size="12" size-md="6">
            <ion-card-header>
              <ion-avatar class="profile-picture">
                <img *ngIf="user" [src]="user.pictureUrl" alt="Profilkép" />
              </ion-avatar>
              <ion-card-title *ngIf="user">
                <h2>{{ user.name }}</h2>
              </ion-card-title>
            </ion-card-header>
          </ion-col>
        </ion-row>
      </ion-grid>
    </ion-card>

    <ion-card class="profile-data">
      <ion-card-content>
        <div class="profile-data-wrapper">
          <div class="profile-info">
            <div class="title">Bemutatkozás</div>
          </div>

          <div class="profile-fields">
            <div class="user-grid">
              <div class="user-info">
                <div class="title">Kor</div>
                <div class="value">{{ getAge(user?.birthDate) }}</div>
              </div>
              <div class="user-info">
                <div class="title">Magasság</div>
                <div class="value">{{ user?.height }}</div>
              </div>
              <div class="user-info">
                <div class="title">Cím</div>
                <div class="value">{{ user?.address }}</div>
              </div>
              <div class="user-info">
                <div class="title">Súly</div>
                <div class="value">{{ user?.weight }}</div>
              </div>
            </div>

            <div class="edit-button-container">
              <ion-button expand="block" class="edit-button">
                Módosítás
              </ion-button>
            </div>
          </div>
        </div>
      </ion-card-content>
    </ion-card>

    <ion-card class="patients"></ion-card>
    <ion-card class="messages"></ion-card>
    <ion-card class="review"></ion-card>
    <ion-card class="today-appointments"></ion-card>
    <ion-card class="new-appointments"></ion-card>
    <ion-card class="declined-appointments"></ion-card>
  </div>
</ion-content>
