<div class="grid">
  <app-doctor-profile-card *ngIf="userService.doctor$() | async as user; else profileCardSkeleton"
    class="profile-card"
    [user]="user"
    [editable]="true"
    (edit)="openEditModal()">>
  </app-doctor-profile-card>

  <ng-template #profileCardSkeleton>
    <div class="dpc">
      <div class="dpc-left">
        <div class="dpc-avatar">
          <ion-skeleton-text animated style="display:block;width:100%;height:100%;border-radius:50%"></ion-skeleton-text>
        </div>
        <div class="pc-name" style="min-width:0">
          <ion-skeleton-text animated style="width:180px;height:18px;border-radius:6px;margin:4px 0"></ion-skeleton-text>
          <ion-skeleton-text animated style="width:90px;height:16px;border-radius:999px"></ion-skeleton-text>
        </div>
      </div>

      <div class="dpc-right desktop-only">
        <ion-skeleton-text animated style="width:120px;height:36px;border-radius:8px"></ion-skeleton-text>
      </div>

      <div class="dpc-info">
        <div class="row">
          <ion-skeleton-text animated style="width:120px;height:12px;border-radius:6px"></ion-skeleton-text>
          <ion-skeleton-text animated style="flex:1;height:12px;border-radius:6px"></ion-skeleton-text>
        </div>
        <div class="row">
          <ion-skeleton-text animated style="width:120px;height:12px;border-radius:6px"></ion-skeleton-text>
          <ion-skeleton-text animated style="flex:1;height:12px;border-radius:6px"></ion-skeleton-text>
        </div>
        <div class="row desktop-only">
          <ion-skeleton-text animated style="width:120px;height:12px;border-radius:6px"></ion-skeleton-text>
          <ion-skeleton-text animated style="flex:1;height:12px;border-radius:6px"></ion-skeleton-text>
        </div>
        <div class="row desktop-only">
          <ion-skeleton-text animated style="width:120px;height:12px;border-radius:6px"></ion-skeleton-text>
          <ion-skeleton-text animated style="flex:1;height:12px;border-radius:6px"></ion-skeleton-text>
        </div>
      </div>

      <div class="dpc-intro">
        <ion-skeleton-text animated style="width:140px;height:16px;border-radius:6px;margin-bottom:10px"></ion-skeleton-text>
        <ion-skeleton-text animated style="width:100%;height:10px;border-radius:6px;margin-bottom:6px"></ion-skeleton-text>
        <ion-skeleton-text animated style="width:92%;height:10px;border-radius:6px;margin-bottom:6px"></ion-skeleton-text>
        <ion-skeleton-text animated style="width:80%;height:10px;border-radius:6px;margin-bottom:6px"></ion-skeleton-text>
      </div>

      <div class="dpc-edit-bottom-wrap mobile-only">
        <ion-skeleton-text animated style="width:100%;height:36px;border-radius:8px"></ion-skeleton-text>
      </div>
    </div>
  </ng-template>

  <ion-card class="review">
    <div class="card-header">
      <h2 class="header-title">Értékelésem</h2>
    </div>

    <div class="rating">
      <div class="rating-icons">
        <ion-icon *ngFor="let icon of starIcons" [name]="icon"></ion-icon>
      </div>
      <span class="rating-number">{{ roundedRating | number:'1.1-1' }}/5</span>
    </div>
  </ion-card>

  <ion-card class="today-appointments">
    <div class="card-header">
      <h2 class="header-title">Mai időpontjaim</h2>
      <ion-button class="expand-btn" [routerLink]="['/appointments']">
        <ion-icon name="chevron-forward-outline"></ion-icon>
      </ion-button>
    </div>

    <div class="appointment-count">
      <span>{{ todaysAppointments }}</span>
    </div>
  </ion-card>

  <ion-card class="patients">
    <div class="card-header">
      <h2 class="header-title">Pácienseim</h2>
      <ion-button class="expand-btn" [routerLink]="['/appointments']">
        <ion-icon name="chevron-forward-outline"></ion-icon>
      </ion-button>
    </div>

    <div class="appointment-count">
      <span>{{ todaysAppointments }}</span>
    </div>
  </ion-card>

  <ion-card class="messages">
    <div class="card-header">
      <h2 class="header-title">Olvasatlan üzeneteim</h2>
      <ion-button class="expand-btn" [routerLink]="['/appointments']">
        <ion-icon name="chevron-forward-outline"></ion-icon>
      </ion-button>
    </div>

    <div class="appointment-count">
      <span>{{ todaysAppointments }}</span>
    </div>
  </ion-card>

  <ion-card class="new-appointments">
    <div class="card-header">
      <h2 class="header-title">Új időpontjaim</h2>
      <ion-button class="expand-btn" [routerLink]="['/appointments']">
        <ion-icon name="chevron-forward-outline"></ion-icon>
      </ion-button>
    </div>

    <div class="appointment-count">
      <span>{{ todaysAppointments }}</span>
    </div>
  </ion-card>

  <ion-card class="declined-appointments">
    <div class="card-header">
      <h2 class="header-title">Elutasított időpontjaim</h2>
      <ion-button class="expand-btn" [routerLink]="['/appointments']">
        <ion-icon name="chevron-forward-outline"></ion-icon>
      </ion-button>
    </div>

    <div class="appointment-count">
      <span>{{ todaysAppointments }}</span>
    </div>
  </ion-card>
</div>
