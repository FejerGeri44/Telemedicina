<div class="container">
  <!-- SKELETON -->
  <ion-grid *ngIf="loading">
    <ion-row>
      <ion-col size="12" size-md="6" size-lg="4" *ngFor="let s of [1,2,3,4,5,6]">
        <ion-card>
          <ion-card-header class="card-header">
            <ion-skeleton-text animated style="width:60px;height:60px;border-radius:50%;"></ion-skeleton-text>
            <div class="header-text">
              <ion-skeleton-text animated style="width:120px;height:16px;"></ion-skeleton-text>
              <ion-skeleton-text animated style="width:80px;height:12px;margin-top:6px;"></ion-skeleton-text>
            </div>
          </ion-card-header>
          <ion-card-content>
            <ion-skeleton-text animated style="width:90%;height:12px;"></ion-skeleton-text>
            <ion-skeleton-text animated style="width:70%;height:12px;margin-top:6px;"></ion-skeleton-text>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>

  <!-- ÜRES ÁLLAPOT -->
  <div *ngIf="!loading && pendingDoctors.length === 0" class="no-data">
    <span class="no-data-text">(N/A)</span>
    <span class="no-data-sub">Jelenleg nincs engelyékérésre várakozó Orvosi jelentkezés.</span>
  </div>

  <!-- GRID -->
  <ion-grid *ngIf="!loading && pendingDoctors.length > 0">
    <ion-row>
      <ion-col size="12" size-md="6" size-lg="4" *ngFor="let doctor of pendingDoctors">
        <ion-card>
          <ion-card-header class="card-header">
            <div class="avatar">
              <img [src]="doctor.user.pictureUrl" alt="avatar" />
            </div>
            <div class="header-text">
              <ion-card-title>{{ doctor.user.name }}</ion-card-title>
            </div>
          </ion-card-header>

          <ion-card-content>
            <p><strong>Telefon:</strong> {{ formatPhoneNumber(doctor.user?.phoneNumber) }}</p>
            <p><strong>Email:</strong> {{ doctor.user?.email }}</p>
            <p><strong>Specialitás:</strong> {{ doctor.doctor?.speciality }}</p>
            <p><strong>Regisztráció dátuma:</strong> {{ doctor.doctor?.registDate }}</p>
          </ion-card-content>

          <div class="button-row">
            <ion-button class="btn-secondary approval" (click)="confirmation(doctor)">Engedély megadása</ion-button>
          </div>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</div>
