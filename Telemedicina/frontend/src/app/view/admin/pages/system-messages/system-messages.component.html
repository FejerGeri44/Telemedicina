<div class="form-wrap">
  <div class="form-head">
    <ion-icon name="alert-circle-outline"></ion-icon>
    <h2>Rendszerüzenet létrehozása</h2>
  </div>

  <form (ngSubmit)="createMessage()" #messageForm="ngForm">
    <div class="columns">
      <div class="col-1">
        <div class="field">
          <ion-item>
            <ion-label position="stacked">Cím</ion-label>
            <ion-input name="title" [(ngModel)]="formData.title" required></ion-input>
          </ion-item>
        </div>

        <div class="field">
          <ion-item>
            <ion-label position="stacked">Üzenet</ion-label>
            <ion-textarea name="message" [(ngModel)]="formData.message" required></ion-textarea>
          </ion-item>
        </div>

        <div class="field">
          <ion-item>
            <ion-label position="stacked">Típus</ion-label>
            <ion-select name="type" [(ngModel)]="formData.type" required>
              <ion-select-option value="info">Info</ion-select-option>
              <ion-select-option value="warning">Figyelmeztetés</ion-select-option>
              <ion-select-option value="error">Hiba</ion-select-option>
              <ion-select-option value="success">Siker</ion-select-option>
            </ion-select>
          </ion-item>
        </div>
      </div>

      <div class="col-2">
        <div class="field">
          <ion-item>
            <ion-label position="stacked">Célcsoport</ion-label>
            <ion-select name="audience" [(ngModel)]="formData.audience" required>
              <ion-select-option value="all">Mindenki</ion-select-option>
              <ion-select-option value="patient">Páciensek</ion-select-option>
              <ion-select-option value="doctor">Orvosok</ion-select-option>
              <ion-select-option value="admin">Adminok</ion-select-option>
            </ion-select>
          </ion-item>
        </div>

        <div class="field">
          <ion-item>
            <ion-label position="stacked">Érvényes eddig</ion-label>
            <ion-datetime name="validUntil" presentation="date" [(ngModel)]="formData.validUntil"></ion-datetime>
          </ion-item>
        </div>
      </div>
    </div>
    <div class="btn-row">
      <ion-button class="btn-secondary" type="button" (click)="resetForm()">Mégse</ion-button>
      <ion-button class="btn-primary" type="submit" [disabled]="!messageForm.form.valid">Mentés</ion-button>
    </div>
  </form>
</div>
