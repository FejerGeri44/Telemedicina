<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Kijelentkezés</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="logout-content">
  <div class="modal-box">
    <p class="logout-message">Biztosan ki szeretnél jelentkezni?</p>
    <div class="logout-buttons">
      <ion-button class="btn-secondary" (click)="dismiss()">Nem</ion-button>
      <ion-button class="btn-primary" (click)="confirm()">Igen</ion-button>
    </div>
  </div>
</ion-content>
