<ion-fab *ngIf="!isOpen && showBubble" class="chat-fab">
  <ion-fab-button size="small" (click)="open()">
    <ion-icon name="chatbubbles-outline"></ion-icon>
  </ion-fab-button>
</ion-fab>

<div
  class="chat-window"
  *ngIf="isOpen || !showBubble"
  [ngClass]="{
    'user-view': showBubble,
    'admin-view': !showBubble
  }">
  <ion-header class="chatbot-header">
    <ion-toolbar>
      <ion-title>{{ audience === 'patient' ? 'Páciens asszisztens' : 'Orvosi asszisztens' }}</ion-title>
      <ion-buttons slot="end">
        <ion-button fill="clear" (click)="refresh()" [disabled]="msgs.length === 0">
          <ion-icon name="refresh" slot="icon-only"></ion-icon>
        </ion-button>
        <ion-button *ngIf="showBubble" fill="clear" (click)="close()">
          <ion-icon name="close" slot="icon-only"></ion-icon>
        </ion-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>

  <ion-content class="chatbot-content">
    <div *ngIf="msgs.length === 0" class="greeting">
      <p>{{ greeting }}</p>
      <div class="chips" *ngIf="quickStarts?.length">
        <ion-chip *ngFor="let qs of quickStarts" (click)="pick(qs)">
          <ion-icon *ngIf="qs.label" [name]="qs.icon"></ion-icon>
          <ion-label>{{ qs.label }}</ion-label>
        </ion-chip>
      </div>
    </div>

    <div class="dialog">
      <div *ngFor="let m of msgs"
           class="bubble"
           [class.user]="m.who==='user'"
           [class.bot]="m.who==='bot'">
        {{ m.text }}
      </div>
      <div class="chips suggestions"
           *ngIf="isFallback && fallbackSuggestions?.length">
        <ion-chip *ngFor="let s of fallbackSuggestions"
                  (click)="pickSuggestion(s)">
          <ion-icon *ngIf="s.icon" [name]="s.icon"></ion-icon>
          <ion-label>{{ s.label }}</ion-label>
        </ion-chip>
      </div>
    </div>
  </ion-content>

  <ion-footer class="chatbot-footer">
    <ion-toolbar>
      <ion-input [(ngModel)]="input" placeholder="Írj üzenetet..." (keyup.enter)="send(input); input=''"></ion-input>
      <ion-buttons slot="end">
        <ion-button (click)="send(input); input=''" [disabled]="!input">Küldés</ion-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-footer>
</div>
