<!-- 1) Kerek indítógomb jobb alsó sarokban -->
<ion-fab *ngIf="!isOpen" vertical="bottom" horizontal="end" slot="fixed" class="chat-fab">
  <ion-fab-button size="small" (click)="open()">
    <ion-icon name="chatbubbles-outline"></ion-icon>
  </ion-fab-button>
</ion-fab>

<!-- 2) Felugró chat ablak -->
<div class="chat-window" *ngIf="isOpen">
  <ion-header class="chatbot-header">
    <ion-toolbar>
      <ion-title>{{ audience === 'patient' ? 'Páciens asszisztens' : 'Orvosi asszisztens' }}</ion-title>
      <ion-buttons slot="end">
        <ion-button fill="clear" (click)="close()">
          <ion-icon name="close" slot="icon-only"></ion-icon>
        </ion-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>

  <ion-content class="chatbot-content">
    <!-- Köszönő képernyő + beszédindítók -->
    <div *ngIf="msgs.length === 0" class="greeting">
      <p>{{ greeting }}</p>
      <div class="chips" *ngIf="quickStarts?.length">
        <ion-chip *ngFor="let qs of quickStarts" (click)="pick(qs)">
          <ion-icon *ngIf="qs.icon" [name]="qs.icon"></ion-icon>
          <ion-label>{{ qs.label }}</ion-label>
        </ion-chip>
      </div>
    </div>

    <!-- Párbeszéd buborékok -->
    <div class="dialog">
      <div *ngFor="let m of msgs" [class.user]="m.who==='user'" [class.bot]="m.who==='bot'" class="bubble">
        {{ m.text }}
      </div>
    </div>
  </ion-content>

  <ion-footer class="chatbot-footer">
    <ion-toolbar>
      <!-- Tipp: így elkerülöd az NG5 típuskonfliktust -->
      <ion-input [(ngModel)]="input" placeholder="Írj üzenetet..." (keyup.enter)="send(input); input=''"></ion-input>
      <ion-buttons slot="end">
        <ion-button (click)="send(input); input=''">Küldés</ion-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-footer>
</div>
