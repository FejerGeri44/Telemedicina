<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Rendszerüzenet</ion-title>

    <ion-buttons slot="end">
      <ion-button fill="clear" (click)="dismiss()">
        <ion-icon name="close" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content *ngIf="current as msg">
  <div class="card">
    <div class="hero" [ngSwitch]="msg?.type">
      <img *ngSwitchCase="'info'" src="pictures/system-message-pictures/information-heroImg.png" alt="info hero">
      <img *ngSwitchCase="'warning'" src="pictures/system-message-pictures/warning-heroImg.png" alt="warning hero">
      <img *ngSwitchCase="'error'" src="pictures/system-message-pictures/error-heroImg.png" alt="error hero">
      <img *ngSwitchDefault src="pictures/system-message-pictures/information-heroImg.png" alt="default hero">
    </div>

    <div class="body">
      <div class="badges">
        <ion-badge color="light" *ngIf="msg.validUntil">Érvényes: {{ msg.validUntil }}</ion-badge>
      </div>

      <h2 class="title">{{ msg.title }}</h2>

      <p class="message">
        {{ msg.message }}
      </p><br><br>
    </div>
  </div>
</ion-content>
