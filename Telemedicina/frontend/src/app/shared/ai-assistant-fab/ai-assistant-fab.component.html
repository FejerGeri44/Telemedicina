<ng-container *ngIf="!(isOpen | async); else chatWindow">
  <ion-fab vertical="bottom" horizontal="end" slot="fixed" class="ai-fab-container">
    <div class="initial-message-bubble" *ngIf="showInitialMessage">
      {{ quickStartText }}
    </div>

    <ion-fab-button (click)="toggleChat()">
      <ion-icon name="chatbox-ellipses"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ng-container>

<ng-template #chatWindow>
  <div [ngClass]="isCalledByAdmin ? 'admin-ai-chat-window' : 'default-ai-chat-window'">

    <ion-header class="chat-header" mode="ios">
      <ion-toolbar>
        <ion-buttons slot="start">
          <ion-icon class="header-icon" name="sparkles"></ion-icon>
        </ion-buttons>

        <ion-title>{{ chatTitle }}</ion-title>

        <ion-buttons *ngIf="!isCalledByAdmin" slot="end">
          <ion-button (click)="toggleChat()" aria-label="Chat bezárása">
            <ion-icon slot="icon-only" name="close"></ion-icon>
          </ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>

    <ion-content>
      <app-fab-chat
        [quickStarts]="quickStarts"
        [mode]="this.role">
      </app-fab-chat>
    </ion-content>
  </div>
</ng-template>
